apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: menu-service
  template:
    metadata:
      labels:
        app: menu-service
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: menu-service
        image: ghcr.io/dev-cer/apps-nasduk:latest
        ports:
        - containerPort: 8000
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: menu-service
spec:
  type: LoadBalancer
  selector:
    app: menu-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
