apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  # 1 replika: data pesanan masih disimpan in-memory
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: order-service
        image: ghcr.io/dev-cer/apps-nasduk-order:latest
        ports:
        - containerPort: 8000
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
