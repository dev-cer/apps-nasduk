apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  # 1 replika + Recreate: database SQLite ada di volume ReadWriteOnce
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: order-service
        image: ghcr.io/dev-cer/apps-nasduk-order:latest
        ports:
        - containerPort: 8000
        imagePullPolicy: Always
        env:
        - name: ORDERS_DB_PATH
          value: /data/orders.db
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: order-admin
              key: ADMIN_TOKEN
              optional: true
        volumeMounts:
        - name: order-data
          mountPath: /data
      volumes:
      - name: order-data
        persistentVolumeClaim:
          claimName: order-data
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
