name: Build to GHCR & Deploy to Civo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Kosong kalau cluster belum dibuat; deploy dilewati (image tetap di-build)
      CIVO_KUBECONFIG: ${{ secrets.CIVO_KUBECONFIG }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Menu Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/dev-cer/apps-nasduk:latest

      - name: Build and Push Order Image
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          file: ./order-service/Dockerfile
          push: true
          tags: ghcr.io/dev-cer/apps-nasduk-order:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/dev-cer/apps-nasduk-frontend:latest

      - name: Skip deploy (no cluster configured)
        if: env.CIVO_KUBECONFIG == ''
        run: echo "::warning::Secret CIVO_KUBECONFIG kosong, deploy dilewati. Jalankan scripts/deploy.sh atau scripts\deploy.ps1 untuk membuat cluster dan mengisi secret ini."

      - name: Setup Kubeconfig
        if: env.CIVO_KUBECONFIG != ''
        run: |
          mkdir -p ~/.kube
          echo "$CIVO_KUBECONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Civo Kubernetes
        if: env.CIVO_KUBECONFIG != ''
        run: |
          # Versi lama membuka frontend/menu lewat LoadBalancer; sekarang publik hanya lewat caddy
          for svc in frontend-service menu-service; do
            if [ "$(kubectl get svc "$svc" -o jsonpath='{.spec.type}' 2>/dev/null)" = "LoadBalancer" ]; then
              kubectl delete svc "$svc"
            fi
          done
          kubectl apply -f k8s/
          kubectl rollout restart deployment menu-service order-service frontend-service
